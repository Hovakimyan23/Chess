<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шахматная доска</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="controls">
        <label for="pieceSelect">Выберите фигуру:</label>
        <select id="pieceSelect">
            <option value="king">♚ Король</option>
            <option value="queen">♛ Ферзь</option>
            <option value="rook">♜ Ладья</option>
            <option value="bishop">♝ Слон</option>
            <option value="knight">♞ Конь</option>
            <option value="pawn">♟ Пешка</option>
        </select>
    </div>
    <div id="board"></div>

    <script src="script.js"></script>
</body>
</html>
